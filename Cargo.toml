[workspace]
members = [
    "crates/story-core",
    "crates/story-runtime",
    "crates/story-storage",
    "crates/story-provider",
    "crates/story-eval",
    "crates/story-policy",
]
resolver = "2"

[workspace.package]
version = "0.1.0-alpha.1"
edition = "2021"
rust-version = "1.88"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "=1.44.2", features = ["io-util", "macros", "net", "process", "rt-multi-thread", "sync", "time"] }
reqwest = { version = "=0.12.15", default-features = false, features = ["json", "rustls-tls"] }
zeroize = "1.8"
axum = { version = "=0.8.4", default-features = false, features = ["http1", "json", "tokio"] }
jsonschema = { version = "=0.30.0", default-features = false }
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }
