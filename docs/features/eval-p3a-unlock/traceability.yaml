interfaces:
  - id: API-154
    location: eval/tools/score_artifacts.py
    status: REVIEWED
    purpose: pointwise judge scoring of archived artifacts into eval-score-record/v1 rows
  - id: API-155
    location: eval/tools/compute_pillar_review.py
    status: REVIEWED
    purpose: dimension correlation matrix and pillar merge recommendations from score records
  - id: API-156
    location: eval/tools/compute_spot_check_agreement.py
    status: REVIEWED
    purpose: agreement between blind internal human scores and judge scores
  - id: API-157
    location: eval/tools/generate_governance_page.py
    status: REVIEWED
    purpose: regenerate docs/eval-governance.html from the manifest and repository state
  - id: API-158
    location: eval/manifests/FREEZE.json
    status: REVIEWED
    purpose: freeze record pinning manifest and rubric hashes with evidence links
  - id: API-159
    location: eval/adversarial/stage1
    status: REVIEWED
    purpose: six masking-recipe degradations of the shared comedy_002 baseline
  - id: API-160
    location: eval/cases
    status: REVIEWED
    purpose: 120-case set at the parent contract quotas with sealed holdout
