tests:
  - id: TEST-327
    location: eval/tools/test_score_artifacts.py
    proves: pointwise records are eval-score-record/v1 with medians and fingerprints
  - id: TEST-328
    location: eval/tools/test_score_artifacts.py
    proves: a changed input fingerprint invalidates saved judge results
  - id: TEST-329
    location: eval/tools/test_score_artifacts.py
    proves: complete saved results are reused and partial results resume
  - id: TEST-330
    location: eval/tools/test_score_artifacts.py
    proves: invalid judge output is retried and span validation is enforced
  - id: TEST-331
    location: eval/tools/test_compute_pillar_review.py
    proves: correlated dimensions produce a merge recommendation at the manifest threshold
  - id: TEST-332
    location: eval/tools/test_compute_pillar_review.py
    proves: the matrix rejects ragged or incomplete score records
  - id: TEST-333
    location: eval/tools/test_compute_spot_check_agreement.py
    proves: human and judge scores joined on artifact hash produce agreement
  - id: TEST-334
    location: eval/tools/test_compute_spot_check_agreement.py
    proves: artifacts scored by only one side are reported, not silently dropped
  - id: TEST-335
    location: eval/tools/test_generate_governance_page.py
    proves: the page is regenerated with manifest-derived numbers and repo-derived status
  - id: TEST-336
    location: eval/tools/test_generate_governance_page.py
    proves: --check fails on a hand-edited page
  - id: TEST-337
    location: scripts/test_check_eval_freeze.py
    proves: absence of a freeze record passes and drift after a record fails
  - id: TEST-338
    location: scripts/test_check_eval_freeze.py
    proves: the record pins both manifest and rubric with evidence links
  - id: TEST-339
    location: eval/tools/test_build_stage1_masking_pairs.py
    proves: every negative passes admission gates and only declared edits differ
  - id: TEST-340
    location: eval/tools/test_build_stage1_masking_pairs.py
    proves: all seven masking recipes are covered by stage0 plus stage1 pairs
  - id: TEST-341
    location: eval/tools/test_validate_cases.py
    proves: quotas and corpus checks pass at the 120-case target distribution
  - id: TEST-342
    location: eval/tools/test_split_cases.py
    proves: split assignment keeps premise families together at 120 cases
