feature: local-codex-judge
requirements:
  - id: REQ-103
    implementation:
      - eval/tools/run_stage0_probe.py
      - eval/codex-judge.json
      - schemas/stage0-judge-output-v1.json
    tests:
      - TEST-106
      - TEST-107
      - TEST-108
tests:
