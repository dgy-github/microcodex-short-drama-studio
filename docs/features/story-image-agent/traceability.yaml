interfaces:
  - id: API-201
    location: contracts/media-agent/image-generation-request-v1.json
    status: REVIEWED
    purpose: request an immutable image generation from one prompt revision
  - id: API-203
    location: contracts/media-agent/task-event-v1.json
    status: REVIEWED
    purpose: reuse one media task event envelope across image and video projects
  - id: API-204
    location: contracts/media-agent/media-project-capability-v1.json
    status: BACKEND_IMPLEMENTED
    purpose: append prompt revisions and generation requests through authenticated Rust storage
  - id: API-205
    location: contracts/media-agent/media-gateway-v1.json
    status: BACKEND_IMPLEMENTED
    purpose: provider-neutral authenticated media gateway response contract
