tests:
  - id: TEST-401
    location: ../story-image-agent/tests/test_workflow.py
    proves: prompt edits and repeated generation append revisions and requests
  - id: TEST-402
    location: projects/story-image-agent/tests/test_workflow.py
    proves: missing provenance and unknown revisions fail closed
  - id: TEST-403
    location: crates/story-media/src/run.rs
    proves: media runs have one terminal, cancellable provider work and restart recovery
  - id: TEST-404
    location: crates/story-provider/src/capability_host.rs
    proves: authenticated media history writes succeed while invalid parentage, duplicates and unauthenticated calls fail closed
  - id: TEST-405
    location: apps/desktop/src-tauri/src/media_projects.rs
    proves: desktop IPC persists typed prompt revisions and image requests through the shared Rust repository
  - id: TEST-406
    location: crates/story-provider/src/media_gateway.rs
    proves: authenticated gateway HTTP response is decoded and invalid routes are rejected
  - id: TEST-407
    location: apps/desktop/src-tauri/src/media_gateway_settings.rs
    proves: desktop persists only validated HTTPS media gateway endpoints without credential material
  - id: TEST-408
    location: apps/desktop/src-tauri/src/media_runtime.rs
    proves: desktop start resume and cancel remain bound to persisted requests and the active run identity
  - id: TEST-409
    location: apps/desktop/src-tauri/src/media_runtime.rs
    proves: desktop sends the direct image request over HTTP and retains a verified artifact with a durable completed event
  - id: TEST-410
    location: apps/desktop/src/lib/MediaStudio.test.ts
    proves: desktop saves story-grounded prompt revisions and persists image requests before starting media runs
