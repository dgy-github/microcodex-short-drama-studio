    interfaces: [API-139, API-143]
    implementation: [BE-116, BE-117, FE-106]
    tests: [TEST-162, TEST-166]
  - id: REQ-152
    interfaces: [API-140, API-142, API-143]
    implementation: [BE-116, BE-117, FE-106]
    tests: [TEST-163, TEST-165, TEST-166]
  - id: REQ-153
    interfaces: [API-141, API-142, API-143]
    implementation: [BE-116, BE-117, FE-106]
    tests: [TEST-164, TEST-165, TEST-166]
  - id: REQ-154
    interfaces: [API-140, API-141, API-143]
    implementation: [BE-116, BE-117]
