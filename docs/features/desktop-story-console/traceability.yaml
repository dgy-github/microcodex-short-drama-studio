interfaces:
  - id: API-111
    location: schemas/story-job-v1.json
    status: FRONTEND_CONNECTED
    purpose: validate the immutable desktop story-project draft
  - id: API-112
    location: schemas/desktop-credential-status-v1.json
    status: FRONTEND_CONNECTED
    purpose: expose credential presence without secret bytes
  - id: API-113
    location: schemas/desktop-run-summary-v1.json
    status: INTEGRATION_PASSED
    purpose: list completed advisory runs
  - id: API-114
    location: schemas/story-workflow-result-v1.json
    status: FRONTEND_CONNECTED
    purpose: inspect one immutable advisory workflow result
  - id: API-115
    location: schemas/desktop-run-snapshot-v1.json
    status: FRONTEND_CONNECTED
    purpose: project incremental run, review, approval, error, and budget state
  - id: API-116
    location: contracts/openapi.yaml
    status: INTEGRATION_PASSED
    purpose: start, replay, fetch, and cancel one authenticated sidecar run
