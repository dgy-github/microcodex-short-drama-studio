tests:
  - id: TEST-130
    location: apps/desktop/src-tauri/src/commands.rs
    proves: desktop job validation reuses story-core
  - id: TEST-131
    location: apps/desktop/src-tauri/src/credentials.rs
    proves: credential responses never include secret bytes
  - id: TEST-132
    location: apps/desktop/src-tauri/src/artifacts.rs
    proves: artifact reads reject unsafe IDs and invalid results
  - id: TEST-133
    location: apps/desktop/package.json
    proves: the Svelte production bundle type-checks and builds
  - id: TEST-134
    location: sidecar/test_server.py
    proves: cancellation is idempotent and appends one durable terminal event
  - id: TEST-135
    location: crates/story-runtime/tests/sidecar_process_smoke.rs
    proves: Rust can invoke the authenticated cancellation operation
  - id: TEST-136
    location: apps/desktop/src-tauri/src/run_controller.rs
    proves: duplicate event sequences do not inflate desktop projections
  - id: TEST-137
    location: apps/desktop/src-tauri/src/run_controller.rs
    proves: real sidecar process completes the deterministic 17-task desktop path and persists its reviewed advisory artifact
  - id: TEST-314
    location: apps/desktop/package.json
    proves: the token recommendation and default type-check and build in the production Svelte bundle
