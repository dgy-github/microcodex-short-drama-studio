[package]
name = "story-desktop"
version = "0.1.0-alpha.1"
edition = "2021"
rust-version = "1.88"
license = "MIT"

[workspace]

[lib]
name = "story_desktop"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "=2.4.0", default-features = false, features = [] }

[dependencies]
jsonschema = { version = "=0.30.0", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.10"
story-core = { path = "../../../crates/story-core" }
story-eval = { path = "../../../crates/story-eval" }
story-provider = { path = "../../../crates/story-provider" }
story-runtime = { path = "../../../crates/story-runtime" }
story-storage = { path = "../../../crates/story-storage" }
tauri = { version = "=2.8.0", default-features = false, features = ["wry"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
uuid = { version = "1", features = ["v4"] }
zeroize = "1"

[dev-dependencies]
axum = "0.8"
tempfile = "3"
tokio = { version = "1", features = ["net"] }
