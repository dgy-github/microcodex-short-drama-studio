name: Governance

"on":
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      sign_artifacts:
        description: Sign with the organization PFX stored in repository secrets
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  governance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pyyaml
      - run: python scripts/init_project.py --check
      - run: python eval/tools/generate_governance_page.py --check
      - run: python scripts/check_eval_freeze.py

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.88"
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --workspace --all-features

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --editable sidecar
      - run: python -m pip install --requirement eval/tools/requirements.txt
      - run: python -m unittest discover -s sidecar -p "test_*.py"
      - run: python -m unittest discover -s eval/tools -p "test_*.py"
      - run: python -m unittest discover -s scripts -p "test_*.py"

  desktop-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.88"
          components: rustfmt, clippy
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm ci
        working-directory: apps/desktop
      - run: npm run check
        working-directory: apps/desktop
      - run: npm run build
        working-directory: apps/desktop
      - run: cargo fmt --all -- --check
        working-directory: apps/desktop/src-tauri
      - run: cargo clippy --all-targets -- -D warnings
        working-directory: apps/desktop/src-tauri
      - run: cargo test
        working-directory: apps/desktop/src-tauri
      - run: python scripts/check_release_configuration.py

  windows-release-smoke:
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.88"
          components: rustfmt, clippy
      - uses: actions/setup-node@v4
        with:
          node-version: "22.14.0"
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.10"
      - name: Build unsigned verification release
        if: ${{ inputs.sign_artifacts != true }}
        run: >-
          .\scripts\build_windows_release.ps1
          -AllowDirty
          -AllowUnlicensedForLocalVerification
        shell: powershell
      - name: Build signed verification release
        if: ${{ inputs.sign_artifacts == true }}
        env:
          WINDOWS_SIGNING_PFX_BASE64: ${{ secrets.WINDOWS_SIGNING_PFX_BASE64 }}
          WINDOWS_SIGNING_PFX_PASSWORD: ${{ secrets.WINDOWS_SIGNING_PFX_PASSWORD }}
        run: .\scripts\build_signed_windows_release.ps1
        shell: powershell
      - name: Upload release evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-release-evidence
          path: target/release-evidence/*.json
          if-no-files-found: error
          retention-days: 7
